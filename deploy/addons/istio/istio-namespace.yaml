apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    kubernetes.io/minikube-addons: istio
    addonmanager.kubernetes.io/mode: EnsureExists
    istio-injection: disabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-installer
  namespace: istio-system
  labels:
    kubernetes.io/minikube-addons: istio
    addonmanager.kubernetes.io/mode: EnsureExists
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: istio-installer
  labels:
    kubernetes.io/minikube-addons: istio
    addonmanager.kubernetes.io/mode: EnsureExists
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: istio-installer
  labels:
    kubernetes.io/minikube-addons: istio
    addonmanager.kubernetes.io/mode: EnsureExists
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: istio-installer
subjects:
- kind: ServiceAccount
  name: istio-installer
  namespace: istio-system